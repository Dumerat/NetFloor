name: CI & SonarQube Analysis

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-quality-gate:
    name: Build, Test & Quality Gate
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Checkout complet (fetch-depth: 0 obligatoire pour SonarQube SCM & Blame)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Étape 2 : Configuration du gestionnaire de paquets pnpm (v9)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Étape 3 : Configuration Node.js 22 avec cache pnpm
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Étape 4 : Installation reproductible et stricte des dépendances
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Étape 5 (1/6) : Lint & Format check
      - name: 1. Lint & Format check
        run: |
          pnpm lint
          pnpm format:check

      # Étape 6 (2/6) : Type-checking strict TypeScript
      - name: 2. TypeScript type-check
        run: pnpm type-check

      # Étape 7 (3/6) : Audit de sécurité des dépendances
      - name: 3. Security dependency audit
        run: pnpm audit --audit-level=high

      # Étape 8 (4/6) : Exécution des tests avec génération de couverture LCOV
      - name: 4. Run tests with coverage
        run: pnpm test:coverage

      # Étape 9 (5/6) : Scan SonarQube officiel
      - name: 5. SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Étape 10 (6/6) : Contrôle bloquant de la Quality Gate SonarQube
      - name: 6. SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
