services:
  caddy:
    image: caddy:2.10-alpine
    container_name: netfloor-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend-net
      - backend-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: netfloor-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend-net
      - storage-net

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: netfloor-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["pnpm", "db:migrate"]
    networks:
      - backend-net

  postgres:
    image: postgres:16-alpine
    container_name: netfloor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    cpus: 2
    networks:
      - backend-net

  postgres-backup:
    image: alpine:3.22
    container_name: netfloor-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      S3_BACKUP_ENABLED: ${S3_BACKUP_ENABLED:-false}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-${S3_BUCKET}}
      BACKUP_CRON: ${BACKUP_CRON:-0 */6 * * *}
    volumes:
      - postgres-backups:/backups
      - ./docker/postgres/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint:
      - /bin/sh
      - -lc
      - |
        apk add --no-cache postgresql16-client gnupg tzdata curl ca-certificates && \
        curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc && \
        chmod +x /usr/local/bin/mc && \
        echo "$BACKUP_CRON /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root && \
        crond -f -l 8
    networks:
      - backend-net
      - storage-net

  minio:
    image: minio/minio:RELEASE.2026-07-23T15-54-02Z
    container_name: netfloor-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - storage-net

  minio-init:
    image: minio/mc:RELEASE.2026-07-18T02-54-14Z
    container_name: netfloor-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./docker/minio/init-bucket.sh:/init-bucket.sh:ro
    entrypoint: ["/bin/sh", "/init-bucket.sh"]
    networks:
      - storage-net

volumes:
  postgres-data:
  postgres-backups:
  minio-data:
  caddy-data:
  caddy-config:

networks:
  frontend-net:
  backend-net:
    internal: true
  storage-net:
    internal: true
