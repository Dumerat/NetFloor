services:
  postgres:
    image: postgres:16-alpine
    container_name: netfloor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: netfloor
    ports:
      - "5432:5432"
    volumes:
      - netfloor_pgdata:/var/lib/postgresql/data

volumes:
  netfloor_pgdata:
