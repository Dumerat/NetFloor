# ====================================================================
# SonarQube Project Configuration - NetFloor Architect
# ====================================================================

# Clés et métadonnées d'identification du projet
sonar.projectKey=netfloor-architect
sonar.projectName=NetFloor Architect
sonar.projectVersion=0.1.0

# Encodage des fichiers sources
sonar.sourceEncoding=UTF-8

# Périmètre des sources de production
sonar.sources=src
sonar.inclusions=src/**

# Périmètre des fichiers de tests
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.spec.ts,src/**/tests/**,src/db/test-*.ts

# Exclusions générales d'analyse (dépendances, caches, builds, artéfacts)
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/drizzle/**,**/*.config.*,**/*.json

# Exclusions spécifiques pour le calcul du taux de couverture
sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.spec.ts,src/**/tests/**,src/db/test-*.ts,src/types/**,src/db/schema/**

# Chemin vers le rapport de couverture LCOV généré par Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
